<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nowlex.AI — Campanha Instagram · 100 Posts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#006bf9;--black:#1a1a1a;--off:#f2f2f2;
  --bg:#0a0a0a;--sur:#141414;--bdr:rgba(255,255,255,.07);
}
body{font-family:'Inter Tight',system-ui,sans-serif;background:var(--bg);color:var(--off);min-height:100vh}

/* ── TOPBAR ── */
.top{position:sticky;top:0;z-index:200;background:rgba(10,10,10,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:0 28px;height:56px;display:flex;align-items:center;gap:16px}
.brand{font-size:15px;font-weight:900;color:var(--blue);letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--off)}
.top-meta{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.fb{font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.35);cursor:pointer;font-family:'Inter Tight',sans-serif;transition:all .15s;white-space:nowrap}
.fb.on,.fb:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── GRID ── */
.page{max-width:1140px;margin:0 auto;padding:32px 20px 80px}
.section-lbl{font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:40px}

/* ── THUMB CARD ── */
.card{aspect-ratio:1/1;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;background:var(--black);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,107,249,.2)}
.card-inner{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;position:relative;z-index:2}
.card-num{position:absolute;top:10px;left:10px;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;color:var(--blue);letter-spacing:.5px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;z-index:3}
.card-fmt{position:absolute;top:10px;right:10px;font-size:8px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;z-index:3}
.fc{background:rgba(0,107,249,.25);color:#90bfff}
.fr{background:rgba(255,255,255,.15);color:#ddd}
.fs{background:rgba(0,200,230,.15);color:#7de0ea}
.fi{background:rgba(80,210,120,.15);color:#7dd49a}
.card-boost{position:absolute;bottom:10px;right:10px;font-size:8px;font-weight:700;background:#fff3cd;color:#7a5700;padding:2px 6px;border-radius:3px;z-index:3}
.card-title{font-size:11px;font-weight:700;line-height:1.3;color:var(--off);text-shadow:0 1px 4px rgba(0,0,0,.8);position:relative;z-index:2}

/* card bg themes */
.t-dark .card-bg{background:#1a1a1a}
.t-blue .card-bg{background:var(--blue)}
.t-white .card-bg{background:var(--off)}
.t-white .card-title{color:var(--black);text-shadow:none}
.t-ink .card-bg{background:#0e0e14}
.card-bg{position:absolute;inset:0;z-index:0}
.card-blob{position:absolute;border-radius:50%;background:rgba(0,107,249,.3);filter:blur(40px);pointer-events:none;z-index:1}

/* ── MODAL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{display:flex;gap:24px;max-width:900px;width:100%;max-height:90vh}
.modal-post{width:420px;min-width:320px;aspect-ratio:1/1;border-radius:14px;overflow:hidden;flex-shrink:0;position:relative;font-family:'Inter Tight',sans-serif}
.modal-side{flex:1;display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden}
.modal-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);font-weight:700}
.modal-fmt-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.modal-boost{font-size:9px;font-weight:700;padding:2px 8px;background:#fff3cd;color:#7a5700;border-radius:3px}
.modal-close{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:transparent;color:var(--off);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:rgba(255,255,255,.1)}
.modal-title{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:12px;color:var(--off)}
.modal-caption{flex:1;overflow-y:auto;font-size:12px;line-height:1.75;color:rgba(242,242,242,.55);white-space:pre-line;padding-right:4px;margin-bottom:14px}
.modal-caption::-webkit-scrollbar{width:3px}
.modal-caption::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.modal-tags{font-family:'DM Mono',monospace;font-size:10px;color:rgba(0,107,249,.6);line-height:1.9;margin-bottom:16px}
.copy-btn{padding:11px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter Tight',sans-serif;transition:all .15s;display:flex;align-items:center;gap:8px}
.copy-btn:hover{background:#0058d4}
.copy-btn.copied{background:#1a7f37}

/* carousel inside modal */
.mtrack{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.mslide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}
.marr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .15s;backdrop-filter:blur(6px)}
.marr:hover{background:var(--blue)}
.marr.L{left:8px}.marr.R{right:8px}
.marr.hide{opacity:0;pointer-events:none}
.mdots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10}
.mdot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:all .2s}
.mdot.on{background:#fff;width:14px;border-radius:2px}

/* slide content */
.si{position:relative;z-index:2;padding:28px 32px;display:flex;flex-direction:column;height:100%}
.blob{position:absolute;border-radius:50%;background:rgba(0,107,249,.28);filter:blur(60px);pointer-events:none}
.t-dark{background:#1a1a1a}
.t-blue{background:var(--blue)}
.t-white{background:var(--off)}
.t-ink{background:#0e0e14}
.t-mid{background:#111827}
.t-dark::before,.t-ink::before,.t-mid::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,107,249,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,107,249,.05) 1px,transparent 1px);background-size:36px 36px}
.eye{font-size:8px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);font-family:'DM Mono',monospace;margin-bottom:auto}
.t-blue .eye{color:rgba(255,255,255,.6)}
.t-white .eye{color:var(--blue)}
.hl{font-size:clamp(20px,4vw,36px);font-weight:800;line-height:1.05;letter-spacing:-1.2px;color:#f2f2f2;margin-bottom:12px}
.t-white .hl{color:#1a1a1a}
.t-blue .hl{color:#fff}
.hl em{font-style:normal;color:var(--blue)}
.t-blue .hl em{color:rgba(255,255,255,.75)}
.t-white .hl em{color:var(--blue)}
.bd{font-size:11px;font-weight:400;line-height:1.65;color:rgba(242,242,242,.5);margin-bottom:16px}
.t-blue .bd{color:rgba(255,255,255,.7)}
.t-white .bd{color:rgba(26,26,26,.55)}
.stat-n{font-size:clamp(52px,10vw,82px);font-weight:900;letter-spacing:-3px;line-height:1;color:var(--blue)}
.t-blue .stat-n{color:#fff}
.stat-l{font-size:11px;font-weight:500;color:rgba(242,242,242,.4);margin-top:4px;margin-bottom:16px;line-height:1.4}
.t-blue .stat-l{color:rgba(255,255,255,.6)}
.t-white .stat-l{color:rgba(26,26,26,.45)}
.rule{width:28px;height:3px;background:var(--blue);border-radius:2px;margin-bottom:14px}
.t-blue .rule{background:rgba(255,255,255,.45)}
.t-white .rule{background:var(--blue)}
.wm{margin-top:auto;font-size:10px;font-weight:800;letter-spacing:-.2px;color:rgba(242,242,242,.12)}
.t-white .wm{color:rgba(26,26,26,.12)}
.t-blue .wm{color:rgba(255,255,255,.22)}
.wm em{font-style:normal;color:var(--blue)}
.t-blue .wm em{color:rgba(255,255,255,.45)}
.cta{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:12px}
.t-blue .cta{color:rgba(255,255,255,.85)}
.cl{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.ci{display:flex;align-items:flex-start;gap:8px;font-size:11px;font-weight:500;color:rgba(242,242,242,.75);line-height:1.4}
.t-white .ci{color:rgba(26,26,26,.72)}
.cdot{width:16px;height:16px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:#fff;font-weight:700;margin-top:1px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:9px;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid rgba(0,107,249,.3);color:rgba(0,107,249,.85);background:rgba(0,107,249,.08)}
.t-blue .chip{border-color:rgba(255,255,255,.3);color:#fff;background:rgba(255,255,255,.1)}
.t-white .chip{border-color:rgba(0,107,249,.25);color:var(--blue)}
.poll{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;width:100%}
.popt{padding:8px 12px;border-radius:6px;border:1px solid rgba(0,107,249,.2);font-size:11px;font-weight:600;color:rgba(242,242,242,.7);background:rgba(0,107,249,.06);display:flex;align-items:center;gap:7px}
.popt::before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid var(--blue);flex-shrink:0}
.story-c{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:14px;padding:32px 28px}
.sq{font-size:clamp(18px,3.5vw,26px);font-weight:800;letter-spacing:-1px;line-height:1.15;color:#f2f2f2;max-width:300px}
.t-blue .sq{color:#fff}
.btn-pill{display:inline-block;font-size:12px;font-weight:700;background:var(--blue);color:#fff;padding:9px 20px;border-radius:28px;margin-top:2px}
.t-blue .btn-pill{background:rgba(255,255,255,.18)}
.sn{position:absolute;top:16px;right:20px;font-size:8px;font-weight:600;color:rgba(255,255,255,.16);font-family:'DM Mono',monospace;letter-spacing:.5px;z-index:3}
.t-white .sn{color:rgba(26,26,26,.15)}
.two-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ts-box{background:rgba(0,107,249,.07);border:1px solid rgba(0,107,249,.18);border-radius:7px;padding:12px 10px;text-align:center}
.ts-n{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-2px;color:var(--blue);line-height:1}
.ts-l{font-size:9px;color:rgba(242,242,242,.35);margin-top:3px;line-height:1.3}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100%}
.ba-col{display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px}
.ba-col:first-child{background:#1a1a1a;border-right:1px solid rgba(255,255,255,.05)}
.ba-col:last-child{background:#0d1929}
.ba-lbl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.ba-lbl.red{color:#ff5555}.ba-lbl.blue{color:var(--blue)}
.ba-num{font-size:clamp(36px,8vw,60px);font-weight:900;letter-spacing:-3px;line-height:1;margin-bottom:5px}
.ba-num.red{color:#ff5555}.ba-num.blue{color:var(--blue)}
.ba-desc{font-size:10px;color:rgba(242,242,242,.3);line-height:1.5;margin-bottom:12px}
.ba-foot{font-size:9px;color:rgba(242,242,242,.18);font-weight:600;font-family:'DM Mono',monospace}
.qt{border-left:3px solid var(--blue);padding:12px 14px;background:rgba(0,107,249,.06);border-radius:0 7px 7px 0;margin-bottom:14px}
.qt-text{font-size:12px;font-style:italic;color:rgba(242,242,242,.72);line-height:1.6;margin-bottom:6px}

@media(max-width:680px){
  .modal{flex-direction:column;max-height:95vh;overflow-y:auto}
  .modal-post{width:100%;min-width:0;aspect-ratio:1/1}
  .top-meta{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">now<span>lex</span>.ai</div>
  <div class="top-meta">100 POSTS · JUN–SET 2026</div>
  <div class="filters">
    <button class="fb on" onclick="filt('all',this)">Todos</button>
    <button class="fb" onclick="filt('turb',this)">🚀 Turbinar</button>
    <button class="fb" onclick="filt('c',this)">Carrossel</button>
    <button class="fb" onclick="filt('r',this)">Reels</button>
    <button class="fb" onclick="filt('s',this)">Story</button>
    <button class="fb" onclick="filt('i',this)">Imagem</button>
  </div>
</div>

<div class="page">

<!-- grid preenchido via JS -->
<div id="grid" class="grid"></div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-post" id="mpost"></div>
    <div class="modal-side">
      <div class="modal-header">
        <span class="modal-num" id="mnum"></span>
        <span class="modal-fmt-badge" id="mfmt"></span>
        <span class="modal-boost" id="mboost" style="display:none">🚀 Turbinar</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-title" id="mtitle"></div>
      <div class="modal-caption" id="mcap"></div>
      <div class="modal-tags" id="mtags"></div>
      <button class="copy-btn" id="copybtn" onclick="copyLeg()">
        <span>📋</span><span id="copylbl">Copiar Legenda</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DATA — 100 posts
   fmt: c=carrossel, r=reels, s=story, i=imagem
   boost: true = turbinar
   theme: t-dark / t-blue / t-white / t-ink / t-mid
   slides: array de objetos {theme, html}
═══════════════════════════════════════════ */
const POSTS = [
{id:'001',date:'09/06 TER',fmt:'r',boost:true,cat:'Lançamento',
title:'IA que nasce dentro das regras',
caption:`O Judiciário brasileiro processa mais de 80 milhões de casos ativos. Cada minuto conta.\n\nA Nowlex nasceu dentro das regras — integrada ao PJe, eProc e PROJUDI, com conformidade CNJ e LGPD desde o primeiro dia.\n\nNão é mais um software. É IA que entende o fluxo processual de dentro pra fora.\n\n👉 Conheça em nowlex.ai`,
tags:'#nowlex #IAnojudiciário #GovTechBrasil #LegalTechBR #PJe',
slides:[{t:'t-ink',h:`<div class="blob" style="width:320px;height:320px;top:-70px;right:-70px;opacity:.45"></div><div class="si"><div class="eye">nowlex.ai · lançamento</div><div style="flex:1;display:flex;flex-direction:column;justify-content:center"><div class="stat-n">80<span style="font-size:.42em;color:rgba(242,242,242,.28)">M</span></div><div class="stat-l">casos ativos no judiciário brasileiro</div><div class="rule"></div><div class="hl" style="font-size:clamp(18px,3.5vw,28px)">IA que nasce<br>dentro das <em>regras.</em></div><div class="bd" style="font-size:11px;margin-bottom:0">PJe · eProc · PROJUDI<br>Conformidade CNJ e LGPD desde o dia 1.</div></div><div class="wm">now<em>lex</em>.ai</div></div>`}]},

{id:'002',date:'09/06 TER',fmt:'s',boost:false,cat:'Engajamento',
title:'Poll: Quanto tempo classificando processos?',
caption:`Poll de abertura — mapeia a dor do público. Quem votar em "Mais de 3h" recebe DM automático com link nowlex.ai.`,
tags:'#nowlex #judiciário #servidorpúblico',
slides:[{t:'t-dark',h:`<div class="blob" style="width:240px;height:240px;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.16"></div><div class="si"><div class="story-c"><div class="eye" style="margin-bottom:0">enquete · nowlex.ai</div><div class="sq">Quanto tempo você gasta classificando processos manualmente por dia?</div><div class="poll"><div class="popt">Menos de 1h</div><div class="popt">1h a 3h</div><div class="popt">Mais de 3h — todo dia</div></div><div style="font-size:10px;color:rgba(242,242,242,.22)">A IA resolve isso. nowlex.ai</div></div></div>`}]},

{id:'003',date:'10/06 QUA',fmt:'c',boost:true,cat:'Governança',
title:'5 pontos antes de contratar IA no tribunal',
caption:`Adotar IA no judiciário sem verificar esses 5 pontos é assinar um problema futuro.\n\n1 — Conformidade LGPD (Lei 13.709/18)\n2 — Integração nativa: PJe, eProc, PROJUDI\n3 — Auditabilidade total (Res. CNJ 332/2020)\n4 — Soberania de dados: nuvem ou on-premise\n5 — Suporte técnico ao processo licitatório\n\nA Nowlex atende todos os 5. Salve e encaminhe para o gestor de TI do seu tribunal.`,
tags:'#nowlex #LGPD #CNJdigital #GovTechBrasil #IAnojudiciário #tribunaisdigitais',
slides:[
{t:'t-dark',h:`<div class="blob" style="width:300px;height:300px;top:-50px;right:-50px;opacity:.4"></div><span class="sn">1/7</span><div class="si"><div class="eye">checklist · governança</div><div style="flex:1"></div><div class="hl">5 pontos<br>antes de<br>contratar <em>IA</em><br>no tribunal.</div><div class="bd" style="font-size:11px;margin-bottom:0">Para gestores e diretores de TI do setor público.</div><div class="wm" style="margin-top:16px">now<em>lex</em>.ai</div></div>`},
{t:'t-dark',h:`<span class="sn">2/7</span><div class="si"><div class="eye">ponto 01</div><div style="flex:1"></div><div class="rule"></div><div class="hl" style="font-size:clamp(18px,3.5vw,30px)">Conformidade<br><em>LGPD</em></div><div class="bd">A solução trata dados sensíveis dentro da Lei 13.709/18? Logs de auditoria e RIPD são obrigatórios.</div><div class="chip" style="align-self:flex-start">Lei 13.709/18</div><div class="wm" style="margin-top:auto">now<em>lex</em>.ai</div></div>`},
{t:'t-dark',h:`<span class="sn">3/7</span><div class="si"><div class="eye">ponto 02</div><div style="flex:1"></div><div class="rule"></div><div class="hl" style="font-size:clamp(18px,3.5vw,30px)">Integração<br><em>nativa</em></div><div class="bd">Conecta ao PJe, eProc ou PROJUDI sem middleware externo?</div><div class="chips"><span class="chip">PJe</span><span class="chip">eProc</span><span class="chip">PROJUDI</span></div><div class="wm">now<em>lex</em>.ai</div></div>`},
{t:'t-dark',h:`<span class="sn">4/7</span><div class="si"><div class="eye">ponto 03</div><div style="flex:1"></div><div class="rule"></div><div class="hl" style="font-size:clamp(18px,3.5vw,30px)"><em>Auditabilidade</em><br>total</div><div class="bd">Cada decisão da IA é rastreável e explicável? IA caixa-preta é inviável no setor público.</div><div class="chip" style="align-self:flex-start">Res. CNJ 332/2020</div><div class="wm" style="margin-top:auto">now<em>lex</em>.ai</div></div>`},

];

/* ══ RENDER GRID ══ */
const FMT_LABEL = {c:'Carrossel',r:'Reels',s:'Story',i:'Imagem'};
const FMT_CLS   = {c:'fc',r:'fr',s:'fs',i:'fi'};
const THEME_COLORS = {'t-dark':'#1a1a1a','t-blue':'#006bf9','t-white':'#f2f2f2','t-ink':'#0e0e14','t-mid':'#111827'};

function renderGrid(list) {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  list.forEach(p => {
    const th = p.slides[0].t;
    const bg = THEME_COLORS[th] || '#1a1a1a';
    const isLight = th === 't-white';
    const titleColor = isLight ? 'rgba(26,26,26,.85)' : 'rgba(242,242,242,.88)';
    const div = document.createElement('div');
    div.className = 'card ' + th;
    div.dataset.id = p.id;
    div.onclick = () => openModal(p.id);
    div.innerHTML = `
      <div class="card-bg" style="background:${bg}"></div>
      ${th!=='t-white' ? `<div class="card-blob" style="width:140px;height:140px;top:-20px;right:-20px;opacity:.35"></div>` : ''}
      <span class="card-num">#${p.id}</span>
      <span class="card-fmt ${FMT_CLS[p.fmt]}">${FMT_LABEL[p.fmt]}</span>
      ${p.boost ? `<span class="card-boost">🚀</span>` : ''}
      <div class="card-inner">
        <div class="card-title" style="color:${titleColor}">${p.title}</div>
      </div>`;
    g.appendChild(div);
  });
}
renderGrid(POSTS);

/* ══ FILTER ══ */
function filt(type, btn) {
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  let list = POSTS;
  if (type === 'turb') list = POSTS.filter(p => p.boost);
  else if (type !== 'all') list = POSTS.filter(p => p.fmt === type);
  renderGrid(list);
}

/* ══ MODAL STATE ══ */
let MS = 0;
let MCUR = null;

function openModal(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;
  MCUR = p; MS = 0;

  document.getElementById('mnum').textContent = '#' + p.id + ' · ' + p.date;
  const fb = document.getElementById('mfmt');
  fb.textContent = FMT_LABEL[p.fmt];
  fb.className = 'modal-fmt-badge ' + FMT_CLS[p.fmt];
  const mb = document.getElementById('mboost');
  mb.style.display = p.boost ? '' : 'none';
  document.getElementById('mtitle').textContent = p.title;
  document.getElementById('mcap').textContent = p.caption;
  document.getElementById('mtags').textContent = p.tags;
  document.getElementById('copylbl').textContent = 'Copiar Legenda';
  document.getElementById('copybtn').classList.remove('copied');

  buildModalPost(p);
  document.getElementById('overlay').classList.add('open');
}

function buildModalPost(p) {
  const mp = document.getElementById('mpost');
  if (p.slides.length === 1) {
    mp.innerHTML = `<div class="mslide ${p.slides[0].t}" style="height:100%">${p.slides[0].h}</div>`;
  } else {
    const dots = p.slides.map((_, i) => `<div class="mdot${i===0?' on':''}" onclick="mGoTo(${i})"></div>`).join('');
    const slides = p.slides.map(s => `<div class="mslide ${s.t}">${s.h}</div>`).join('');
    mp.innerHTML = `
      <div style="position:relative;height:100%;overflow:hidden;border-radius:14px">
        <button class="marr L hide" id="mal" onclick="mMove(-1)">‹</button>
        <button class="marr R${p.slides.length===1?' hide':''}" id="mar" onclick="mMove(1)">›</button>
        <div class="mtrack" id="mtrack">${slides}</div>
        <div class="mdots" id="mdots">${dots}</div>
      </div>`;
  }
}

function mMove(d) {
  if (!MCUR) return;
  const n = MCUR.slides.length;
  MS = Math.max(0, Math.min(n-1, MS+d));
  mRender(n);
}
function mGoTo(i) { if (!MCUR) return; MS=i; mRender(MCUR.slides.length); }
function mRender(n) {
  const t = document.getElementById('mtrack'); if (!t) return;
  t.style.transform = 'translateX(-' + MS*100 + '%)';
  const al = document.getElementById('mal'); const ar = document.getElementById('mar');
  if (al) al.classList.toggle('hide', MS===0);
  if (ar) ar.classList.toggle('hide', MS===n-1);
  const dots = document.getElementById('mdots');
  if (dots) [...dots.children].forEach((d,i) => d.classList.toggle('on', i===MS));
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  MCUR = null;
}

function copyLeg() {
  if (!MCUR) return;
  navigator.clipboard.writeText(MCUR.caption + '\n\n' + MCUR.tags).then(() => {
    document.getElementById('copylbl').textContent = 'Copiado!';
    document.getElementById('copybtn').classList.add('copied');
    setTimeout(() => {
      document.getElementById('copylbl').textContent = 'Copiar Legenda';
      document.getElementById('copybtn').classList.remove('copied');
    }, 2000);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal({target:document.getElementById('overlay')}); });
</script>
